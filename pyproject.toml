[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cabo-stats"
version = "0.1.0"
description = "Leaderboards, Elo ratings, records and live win probabilities for the card game Cabo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vincent R. Freund" }]
dependencies = ["pandas>=2.0", "numpy>=1.24", "tabulate>=0.9"]

[project.optional-dependencies]
app = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7"]

[project.scripts]
cabo-stats = "cabo_stats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
